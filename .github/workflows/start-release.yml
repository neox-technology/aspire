name: start-release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump from latest v* tag (none keeps core; with preview off, promotes by stripping -preview.N)"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - none
        default: patch
      preview:
        description: "Cut as X.Y.Z-preview.N (bump → -preview.1; none → increment preview)"
        required: false
        type: boolean
        default: false

concurrency:
  group: start-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  start-release:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.NEOX_GITFLOW_APP_ID }}
          private-key: ${{ secrets.NEOX_GITFLOW_APP_PRIVATE_KEY }}

      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: develop
          token: ${{ steps.app-token.outputs.token }}

      - name: Compute next version
        env:
          BUMP: ${{ inputs.bump }}
          PREVIEW: ${{ inputs.preview }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          LATEST=$(git tag -l 'v*' --sort=-v:refname | head -n1 || true)
          if [ -z "$LATEST" ]; then
            BASE="0.0.0"
          else
            BASE="${LATEST#v}"
            if ! [[ "$BASE" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-preview\.([0-9]+))?$ ]]; then
              echo "::error::Latest tag '$LATEST' must be vX.Y.Z or vX.Y.Z-preview.N"
              exit 1
            fi
          fi
          MAJOR=$(echo "$BASE" | cut -d. -f1)
          MINOR=$(echo "$BASE" | cut -d. -f2)
          PATCH=$(echo "$BASE" | cut -d. -f3 | sed 's/[^0-9].*//')
          PREVIEW_N=""
          if [[ "$BASE" =~ -preview\.([0-9]+)$ ]]; then
            PREVIEW_N="${BASH_REMATCH[1]}"
          fi
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
            none) ;;
            *) echo "::error::Unsupported bump '$BUMP'"; exit 1 ;;
          esac
          CORE="${MAJOR}.${MINOR}.${PATCH}"
          if [ "$PREVIEW" = "true" ]; then
            if [ "$BUMP" = "none" ]; then
              if [ -n "$PREVIEW_N" ]; then NEXT_PREVIEW=$((PREVIEW_N + 1)); else NEXT_PREVIEW=1; fi
            else
              NEXT_PREVIEW=1
            fi
            VERSION="${CORE}-preview.${NEXT_PREVIEW}"
            STABILIZE="false"
          else
            VERSION="$CORE"
            STABILIZE="true"
          fi
          BRANCH="release/${VERSION}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "::error::Branch $BRANCH already exists on origin"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          echo "CORE=$CORE" >> "$GITHUB_ENV"
          echo "STABILIZE=$STABILIZE" >> "$GITHUB_ENV"

      - name: Push release branch
        run: |
          set -euo pipefail
          git config user.name "neox-gitflow[bot]"
          git config user.email "neox-gitflow[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          PROPS="eng/Versions.props"
          sed -i "s|<VersionPrefix>[^<]*</VersionPrefix>|<VersionPrefix>${CORE}</VersionPrefix>|" "$PROPS"
          sed -i "s|<StabilizePackageVersion>[^<]*</StabilizePackageVersion>|<StabilizePackageVersion>${STABILIZE}</StabilizePackageVersion>|" "$PROPS"
          grep -q "<VersionPrefix>${CORE}</VersionPrefix>" "$PROPS"
          grep -q "<StabilizePackageVersion>${STABILIZE}</StabilizePackageVersion>" "$PROPS"
          git add "$PROPS"
          git commit -m "chore: set package version ${CORE} (stabilize=${STABILIZE}) for ${BRANCH}"
          git push -u origin "$BRANCH"
