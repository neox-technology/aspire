name: Publish NuGet

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Pack and push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute OfficialBuildId
        id: version
        run: echo "official_build_id=$(date -u +%Y%m%d).${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build and pack
        run: >
          ./eng/common/build.sh
          --ci --restore --build --pack
          --configuration Release
          /p:Sign=false
          /p:OfficialBuildId=${{ steps.version.outputs.official_build_id }}

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push packages to nuget.org
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(artifacts/packages/Release/Shipping/*.nupkg)
          symbols=(artifacts/packages/Release/Shipping/*.snupkg)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "No Shipping packages found under artifacts/packages/Release/Shipping/"
            exit 1
          fi
          dotnet nuget push "${packages[@]}" \
            --source "https://api.nuget.org/v3/index.json" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate
          if [ ${#symbols[@]} -gt 0 ]; then
            dotnet nuget push "${symbols[@]}" \
              --source "https://api.nuget.org/v3/index.json" \
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
              --skip-duplicate
          fi
