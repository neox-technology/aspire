name: CI

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard release/hotfix version
        if: >
          github.base_ref == 'main' &&
          (startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'hotfix/'))
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          RAW="${HEAD_REF#release/}"
          RAW="${RAW#hotfix/}"
          RAW="${RAW#v}"
          if ! [[ "$RAW" =~ ^([0-9]+\.[0-9]+\.[0-9]+)(-preview\.[0-9]+)?$ ]]; then
            echo "::error::Branch '$HEAD_REF' must end with semver (e.g. release/1.2.3 or hotfix/1.2.4-preview.1)"
            exit 1
          fi
          CORE="${BASH_REMATCH[1]}"
          if [[ "$RAW" == *-preview.* ]]; then
            EXPECT_STABILIZE="false"
          else
            EXPECT_STABILIZE="true"
          fi

          PROPS="eng/Versions.props"
          if [ ! -f "$PROPS" ]; then
            echo "OK: branch semver '$RAW' valid; no $PROPS to align"
            exit 0
          fi

          PREFIX=$(grep -oP '(?<=<VersionPrefix>)[^<]+' "$PROPS" | head -n1)
          STABILIZE=$(grep -oP '(?<=<StabilizePackageVersion>)[^<]+' "$PROPS" | head -n1)

          if [ "$PREFIX" != "$CORE" ]; then
            echo "::error::$PROPS VersionPrefix='$PREFIX' does not match branch core '$CORE' (from $HEAD_REF). Update Versions.props before merging."
            exit 1
          fi
          if [ "$STABILIZE" != "$EXPECT_STABILIZE" ]; then
            echo "::error::$PROPS StabilizePackageVersion='$STABILIZE' expected '$EXPECT_STABILIZE' for branch $HEAD_REF."
            exit 1
          fi
          echo "OK: VersionPrefix=$PREFIX StabilizePackageVersion=$STABILIZE matches $HEAD_REF"

      - name: Build, test, and pack
        run: ./eng/common/build.sh --ci --restore --build --test --pack --configuration Release /p:Sign=false

      - name: Upload Shipping packages
        uses: actions/upload-artifact@v4
        with:
          name: Shipping
          path: artifacts/packages/Release/Shipping/
          if-no-files-found: error
