name: gitflow-start-release

# Cut a release branch from develop only. Version comes from eng/Versions.props
# (VersionPrefix; preview.N when StabilizePackageVersion is false).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  start-release:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    name: Cut release branch and open PR
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.NEOX_GITFLOW_APP_ID }}
          private-key: ${{ secrets.NEOX_GITFLOW_APP_PRIVATE_KEY }}

      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: develop
          token: ${{ steps.app-token.outputs.token }}

      - name: Compute next version
        run: |
          set -euo pipefail
          git fetch --tags --force
          git fetch origin 'refs/heads/release/*:refs/remotes/origin/release/*' 2>/dev/null || true

          PROPS="eng/Versions.props"
          if [ ! -f "$PROPS" ]; then
            echo "::error::$PROPS not found"
            exit 1
          fi

          VERSION_PREFIX=$(sed -n 's/.*<VersionPrefix>\([^<]*\)<\/VersionPrefix>.*/\1/p' "$PROPS" | head -n1)
          LABEL=$(sed -n 's/.*<PreReleaseVersionLabel>\([^<]*\)<\/PreReleaseVersionLabel>.*/\1/p' "$PROPS" | head -n1)
          STABILIZE=$(sed -n 's/.*<StabilizePackageVersion>\([^<]*\)<\/StabilizePackageVersion>.*/\1/p' "$PROPS" | head -n1)

          LABEL="${LABEL:-preview}"
          STABILIZE="${STABILIZE:-false}"

          if [ -z "$VERSION_PREFIX" ]; then
            echo "::error::VersionPrefix missing in $PROPS"
            exit 1
          fi
          if ! [[ "$VERSION_PREFIX" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VersionPrefix '$VERSION_PREFIX' is not X.Y.Z"
            exit 1
          fi

          echo "Versions.props: VersionPrefix=$VERSION_PREFIX PreReleaseVersionLabel=$LABEL StabilizePackageVersion=$STABILIZE"

          STABILIZE_LC=$(echo "$STABILIZE" | tr '[:upper:]' '[:lower:]')
          if [ "$STABILIZE_LC" = "true" ]; then
            VERSION="$VERSION_PREFIX"
          else
            PREFIX_TAG="v${VERSION_PREFIX}-${LABEL}."
            PREFIX_BRANCH="release/${VERSION_PREFIX}-${LABEL}."
            MAX_N=0

            while IFS= read -r t; do
              [ -z "$t" ] && continue
              N="${t#"$PREFIX_TAG"}"
              if [[ "$N" =~ ^[0-9]+$ ]] && [ "$N" -gt "$MAX_N" ]; then
                MAX_N=$N
              fi
            done < <(git tag -l "${PREFIX_TAG}*" 2>/dev/null || true)

            while IFS= read -r b; do
              [ -z "$b" ] && continue
              NAME="${b#origin/}"
              N="${NAME#"$PREFIX_BRANCH"}"
              if [[ "$N" =~ ^[0-9]+$ ]] && [ "$N" -gt "$MAX_N" ]; then
                MAX_N=$N
              fi
            done < <(git branch -r --list "origin/${PREFIX_BRANCH}*" 2>/dev/null || true)

            # Also check remote heads not fetched locally
            while IFS= read -r ref; do
              [ -z "$ref" ] && continue
              NAME="${ref#refs/heads/}"
              N="${NAME#"$PREFIX_BRANCH"}"
              if [[ "$N" =~ ^[0-9]+$ ]] && [ "$N" -gt "$MAX_N" ]; then
                MAX_N=$N
              fi
            done < <(git ls-remote --heads origin "release/${VERSION_PREFIX}-${LABEL}.*" 2>/dev/null | awk '{print $2}' || true)

            N=$((MAX_N + 1))
            VERSION="${VERSION_PREFIX}-${LABEL}.${N}"
            echo "Next preview number: $N (max existing $MAX_N)"
          fi

          BRANCH="release/${VERSION}"
          echo "Version $VERSION (branch $BRANCH)"

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "::error::Branch $BRANCH already exists on origin"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Create release branch and PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git config user.name "neox-gitflow[bot]"
          git config user.email "neox-gitflow[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git push -u origin "$BRANCH"

          EXISTING=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING already open for $BRANCH → main"
            exit 0
          fi

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Release: $VERSION" \
            --body "Automated GitFlow release branch \`$BRANCH\` cut from \`develop\` (version from \`eng/Versions.props\`). Squash-merge when ready to ship."
