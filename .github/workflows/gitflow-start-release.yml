name: gitflow-start-release

# Cut a release branch from develop only. Select major/minor/patch; next version is computed from the latest v* tag.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump from latest tag"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: read

jobs:
  start-release:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    name: Cut release branch and open PR
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.NEOX_GITFLOW_APP_ID }}
          private-key: ${{ secrets.NEOX_GITFLOW_APP_PRIVATE_KEY }}

      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: develop
          token: ${{ steps.app-token.outputs.token }}

      - name: Compute next version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          git fetch --tags --force

          LATEST=$(git tag -l 'v*' --sort=-v:refname | head -n1 || true)
          if [ -z "$LATEST" ]; then
            BASE="0.0.0"
            echo "No v* tags found — base $BASE"
          else
            BASE="${LATEST#v}"
            if ! [[ "$BASE" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)([.-].+)?$ ]]; then
              echo "::error::Latest tag '$LATEST' is not semver vX.Y.Z"
              exit 1
            fi
            echo "Latest tag: $LATEST (base $BASE)"
          fi

          MAJOR=$(echo "$BASE" | cut -d. -f1)
          MINOR=$(echo "$BASE" | cut -d. -f2)
          PATCH=$(echo "$BASE" | cut -d. -f3 | sed 's/[^0-9].*//')

          case "$BUMP" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
            *)
              echo "::error::Unsupported bump '$BUMP'"
              exit 1
              ;;
          esac

          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          BRANCH="release/${VERSION}"
          echo "Bump $BUMP → $VERSION (branch $BRANCH)"

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "::error::Branch $BRANCH already exists on origin"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Create release branch and PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git config user.name "neox-gitflow[bot]"
          git config user.email "neox-gitflow[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git push -u origin "$BRANCH"

          EXISTING=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING already open for $BRANCH → main"
            exit 0
          fi

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Release: $VERSION" \
            --body "Automated GitFlow release branch \`$BRANCH\` cut from \`develop\` (bump \`${{ inputs.bump }}\`). Squash-merge when ready to ship."
