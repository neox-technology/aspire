name: release-private-publish

# Manual build/test/pack from a release/* branch, then push Shipping packages
# to the private GitHub Packages feed (daily prerelease identity).

on:
  workflow_dispatch:

concurrency:
  group: release-private-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    name: Guard and compute build id
    outputs:
      official_build_id: ${{ steps.version.outputs.official_build_id }}
      artifact_name: ${{ steps.version.outputs.artifact_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard release branch semver
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          RAW="${REF_NAME#release/}"
          RAW="${RAW#v}"
          if ! [[ "$RAW" =~ ^([0-9]+\.[0-9]+\.[0-9]+)(-preview\.[0-9]+)?$ ]]; then
            echo "::error::Branch '$REF_NAME' must be release/X.Y.Z or release/X.Y.Z-preview.N"
            exit 1
          fi
          CORE="${BASH_REMATCH[1]}"
          if [[ "$RAW" == *-preview.* ]]; then
            EXPECT_STABILIZE="false"
          else
            EXPECT_STABILIZE="true"
          fi

          PROPS="eng/Versions.props"
          if [ ! -f "$PROPS" ]; then
            echo "OK: branch semver '$RAW' valid; no $PROPS to align"
            exit 0
          fi

          PREFIX=$(grep -oP '(?<=<VersionPrefix>)[^<]+' "$PROPS" | head -n1)
          STABILIZE=$(grep -oP '(?<=<StabilizePackageVersion>)[^<]+' "$PROPS" | head -n1)

          if [ "$PREFIX" != "$CORE" ]; then
            echo "::error::$PROPS VersionPrefix='$PREFIX' does not match branch core '$CORE' (from $REF_NAME)."
            exit 1
          fi
          if [ "$STABILIZE" != "$EXPECT_STABILIZE" ]; then
            echo "::error::$PROPS StabilizePackageVersion='$STABILIZE' expected '$EXPECT_STABILIZE' for $REF_NAME."
            exit 1
          fi
          echo "OK: VersionPrefix=$PREFIX StabilizePackageVersion=$STABILIZE matches $REF_NAME"

      - name: Compute OfficialBuildId
        id: version
        run: |
          set -euo pipefail
          BUILD_ID="$(date -u +%Y%m%d).${{ github.run_number }}"
          # Artifact names cannot contain '/'
          SAFE_REF="${GITHUB_REF_NAME//\//-}"
          echo "official_build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "artifact_name=Shipping-daily-${SAFE_REF}-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    uses: ./.github/workflows/arcade-build-test-package.yml
    with:
      official_build_id: ${{ needs.prepare.outputs.official_build_id }}
      artifact_name: ${{ needs.prepare.outputs.artifact_name }}
      extra_msbuild_args: /p:StabilizePackageVersion=false /p:PreReleaseVersionLabel=daily

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    name: Push to GitHub Packages
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download Shipping packages
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact_name }}
          path: packages

      - name: Push packages to GitHub Packages
        run: |
          set -euo pipefail
          shopt -s nullglob
          mapfile -t packages < <(find packages -type f -name '*.nupkg' | sort -u)
          mapfile -t symbols < <(find packages -type f -name '*.snupkg' | sort -u)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "No Shipping packages found in downloaded artifact"
            find packages -type f -print || true
            exit 1
          fi
          source="https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          echo "Publishing ${#packages[@]} package(s) to $source"
          for pkg in "${packages[@]}"; do
            echo "  - $(basename "$pkg")"
          done
          dotnet nuget push "${packages[@]}" \
            --source "$source" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate
          if [ ${#symbols[@]} -gt 0 ]; then
            echo "Publishing ${#symbols[@]} symbol package(s)"
            dotnet nuget push "${symbols[@]}" \
              --source "$source" \
              --api-key "${{ secrets.GITHUB_TOKEN }}" \
              --skip-duplicate
          fi
